name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Lint + ktlint
        run: ./gradlew --no-daemon lintRelease ktlintCheck

      - name: Build release APK (ottimizzato R8)
        run: ./gradlew --no-daemon assembleRelease

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - uses: actions/upload-artifact@v4
        with:
          name: OndaLauncher-release
          path: app/build/outputs/apk/release/*.apk
